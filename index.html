<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>José Rizal | Group 2 E-Portfolio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="intro-page">
  <div class="intro-overlay"></div>
  <main class="intro-container">
    <div class="intro-card">
      <img src="images/rizal-intro.jpg" alt="José Rizal" class="intro-rizal" onerror="this.classList.add('image-missing')">
      <p class="eyebrow">GROUP 2 PRESENTS</p>
      <h1>The Life, Works & Legacy of<br><span>José Rizal</span></h1>
      <p class="intro-text">Before exploring Rizal's literary works, test what you remember about his early life.</p>
      <button class="primary-btn" onclick="startQuiz()">START THE RIZAL QUIZ</button>
    </div>
  </main>

  <section id="quizSection" class="quiz-section hidden">
    <div class="quiz-box">
      <div class="quiz-top">
        <span id="questionNumber">Question 1 of 5</span>
        <span id="scoreDisplay">Score: 0</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <h2 id="question"></h2>
      <div id="answers" class="answers"></div>
      <p id="quizFeedback" class="feedback"></p>
      <button id="nextBtn" class="primary-btn hidden" onclick="nextQuestion()">NEXT</button>
    </div>
  </section>

  <section id="resultSection" class="quiz-section hidden">
    <div class="quiz-box result-box">
      <div class="trophy">🏛️</div>
      <p class="eyebrow">QUIZ COMPLETE</p>
      <h2 id="resultTitle">Rizal Scholar!</h2>
      <p id="finalScore"></p>
      <p id="resultMessage"></p>
      <a href="home.html" class="primary-btn">ENTER GROUP 2'S E-PORTFOLIO →</a>
    </div>
  </section>

  <script src="./script.js" defer></script>
</body>
</html>
